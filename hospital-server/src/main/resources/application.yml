server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: cloud-hospital-server
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:cloud_hospital}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  jackson:
    default-property-inclusion: non_null
logging:
  level:
    com.example.cloudhospital: info
